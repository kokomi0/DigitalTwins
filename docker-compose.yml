version: '3.8'

services:
  # 1. 前端服务 (Nginx + React 18 + Three.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lung_twin_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - twin_net
    restart: always

  # 2. 后端服务 (Flask + SocketIO + Celery)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lung_twin_backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_DEBUG=False
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=TwinAdmin2026!
      - MYSQL_DB=lung_twin_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=TwinAdmin2026!
      - MONGO_URI=mongodb://mongodb:27017/lung_twin_nosql
      - MONGO_DB_NAME=lung_twin_nosql
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - mysql
      - neo4j
      - mongodb
      - redis
    networks:
      - twin_net
    restart: always

  # 3. 关系型数据库 (MySQL 8.0 - RBAC权限、审计表、病例主索引)
  mysql:
    image: mysql:8.0
    container_name: lung_twin_mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=TwinAdmin2026!
      - MYSQL_DATABASE=lung_twin_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init_mysql.sql:/docker-entrypoint-initdb.d/init_mysql.sql
    networks:
      - twin_net
    restart: always

  # 4. 图数据库 (Neo4j 5.x - B1-B10支气管树与1R-12L淋巴结知识图谱)
  neo4j:
    image: neo4j:5.20.0
    container_name: lung_twin_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/TwinAdmin2026!
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - ./database/init_neo4j.cypher:/var/lib/neo4j/import/init_neo4j.cypher
    networks:
      - twin_net
    restart: always

  # 5. 文档数据库 (MongoDB 6.0 - 仿真时序帧与DICOM体素特征)
  mongodb:
    image: mongo:6.0
    container_name: lung_twin_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=lung_twin_nosql
    volumes:
      - mongo_data:/data/db
      - ./database/init_mongo.js:/docker-entrypoint-initdb.d/init_mongo.js
    networks:
      - twin_net
    restart: always

  # 6. 高速缓存与异步消息总线 (Redis 7.0)
  redis:
    image: redis:7.0-alpine
    container_name: lung_twin_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - twin_net
    restart: always

networks:
  twin_net:
    driver: bridge

volumes:
  mysql_data:
  neo4j_data:
  mongo_data:
  redis_data:
