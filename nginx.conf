server {
    listen 80;
    server_name localhost;

    # 开启 Gzip 极限加速传输
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json application/vnd.ms-fontobject font/ttf font/opentype font/x-woff image/svg+xml;
    gzip_vary on;

    # 1. 前端单页应用根路径与自适应路由分发
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 显式指定电脑端桌面工作台入口
    location /desktop {
        root /usr/share/nginx/html;
        rewrite ^/desktop(.*)$ /index.html break;
    }

    # 显式指定手机端触控模式入口
    location /mobile {
        root /usr/share/nginx/html;
        rewrite ^/mobile(.*)$ /index.html break;
    }

    # 2. 后端 RESTful API 反向代理
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 3. WebSocket 实时生理时序推流反向代理
    location /socket.io/ {
        proxy_pass http://backend:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
